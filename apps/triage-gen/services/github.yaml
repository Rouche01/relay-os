# Minimal GitHub REST subset for the triage-gen forcing fixture.
# Hand-authored until OpenAPI import (plan r1) regenerates this from
# https://raw.githubusercontent.com/github/rest-api-description/...
# Secrets never live here — Specs use connection ref github:default.
id: github
title: GitHub REST (issues triage subset)
description: >
  List open issues by label and create issue comments. Enough for the
  acme/widgets bug-triage forcing function; not a full GitHub catalog.
baseUrl: https://api.github.com
auth:
  type: bearer
  connection: true
operations:
  - id: issuesListForRepo
    method: GET
    path: /repos/{owner}/{repo}/issues
    summary: List repository issues (filter by labels / state)
    params:
      - name: owner
        in: path
        required: true
        type: string
      - name: repo
        in: path
        required: true
        type: string
      - name: labels
        in: query
        type: string
        description: Comma-separated label names (e.g. bug)
      - name: state
        in: query
        type: string
        description: open | closed | all
      - name: per_page
        in: query
        type: number
        description: 1–100
      - name: page
        in: query
        type: number
  - id: issuesCreateComment
    method: POST
    path: /repos/{owner}/{repo}/issues/{issue_number}/comments
    summary: Create a comment on an issue (irreversible)
    params:
      - name: owner
        in: path
        required: true
        type: string
      - name: repo
        in: path
        required: true
        type: string
      - name: issue_number
        in: path
        required: true
        type: number
      - name: body
        in: body
        required: true
        type: string
        description: Markdown comment body
